schema_version: 2
study: dynamics_and_full_envelope_hospital_path_planning
status: draft_pre_registered
supersedes_for_final_paper: simulation_validation_protocol.yaml
supersedes_draft: hospital_paper_validation_protocol_v01_superseded.yaml
scope_revision:
  date: "2026-11-01"
  basis: user_selected_manuscript_inclusion_without_forced_controller_coupling
  professor_has_explicitly_confirmed_this_interpretation: false
  previous_draft_is_not_a_frozen_or_executed_hospital_comparison: true
preservation_rule: >-
  The earlier protocol and its corridor-90 evidence remain immutable pilot
  evidence. They are not relabelled as hospital-environment paper trials.

professor_direction:
  received_date: "2026-10-29"
  requirements:
    - include_existing_initial_motion_research_in_the_manuscript
    - replace_simple_geometry_with_bed_and_hospital_workspaces
    - analyze_results_across_diverse_environments
  controller_planner_algorithmic_integration_explicitly_requested: false

research_scope:
  new_contribution: steering_state_dynamics_stopping_and_full_envelope_path_planning
  cics_role: prior_work_and_separately_identified_existing_results
  cics_evidence: studies/CICS26/docs/patient_transport_lateral_final9_results.md
  cics_validated_motion: lateral_departure_with_active_axes_near_90deg_and_differential_drive
  hospital_navigation_motion: longitudinal_and_turning_with_counterphase_front_only_and_rear_only_steering
  new_forward_micro_yaw_controller_required: false
  controller_planner_joint_optimization_required: false
  sequential_lateral_departure_to_navigation: optional_separate_future_validation
  continuation_decision_20261104:
    primary_contribution_unchanged: true
    natural_entry_is_common_execution_setup_not_a_new_planner: true
    immediate_gate: ordinary_0p30m_approach_to_original_H3_start_with_retained_caster_history
    CICS_lateral_departure_to_navigation_bridge: optional_separate_small_system_experiment_not_implemented
    CICS_forward_mode_transfer_or_mandatory_new_initial_controller: false
    use_identical_entry_procedure_for_all_planning_methods_in_future_comparisons: true
    record_entry_failures_and_total_approach_cost_no_success_only_selection: true
  manuscript_requirements:
    - explain_the_common_patient_transport_task_and_distinct_roles
    - distinguish_existing_CICS_results_from_new_IJCAS_results
    - cite_existing_publications_and_do_not_relabel_reused_results_as_new
    - do_not_claim_CICS_lateral_results_validate_forward_micro_steering
  archived_exploratory_branch:
    script: isaac/scripts/isaac_run_ijcas_hospital_h1_initial_motion.py
    result: studies/IJCAS/results/hospital_paper_gate/initial_motion/hospital_h1_initial_micro_yaw_r01.json
    status: failed_development_trial_preserved_not_a_required_planning_gate

claim_boundary:
  primary: >-
    Steering-state, rigid-body, stopping-reachability, and full-body-envelope
    planning is evaluated for hospital-task
    feasibility and terminal accuracy relative to matched conventional and
    ablated methods.
  initial_motion_role: >-
    Existing CICS initial-motion control is described as prior work with its
    original lateral-motion validation. It is not a mandatory front end of the
    new planner or evidence for forward-mode transient performance.
  rigid_body_role: >-
    Newton-Euler force/load constraints are evaluated as safety constraints.
    A performance gain is attributed to them only in cells where they produce
    operational edge rejection or a paired execution difference.
  excluded_until_physical_gate:
    - calibrated_real_platform_force_and_load_validity
    - clinical_safety_or_hospital_deployment_readiness
    - generalization_beyond_the_predeclared_hospital_tasks

hypotheses:
  H2_planning_dynamics:
    statement: >-
      Steering-state and speed-consistent propagation improves execution success
      relative to multimode kinematic planning with instantaneous transitions.
    primary_metrics:
      - task_success
      - terminal_position_error_m
      - terminal_heading_error_deg
  H3_full_envelope:
    statement: >-
      Swept full-body-envelope checking prevents body/caster contact missed by
      centreline or point-footprint planning.
    primary_metrics:
      - obstacle_contact_event_count
      - minimum_clearance_m
      - collision_rejected_edge_count
  H4_integrated_mission:
    statement: >-
      The full proposed method completes the integrated hospital transfer mission
      more reliably than the strongest baseline under paired uncertainty seeds.
    primary_metrics:
      - mission_success
      - mission_time_s
      - safety_abort_count

methods:
  B0_fixed_counterphase_ramp:
    initial_motion: acceleration_limited_ramp
    planner: fixed_counterphase_kinematic
    envelope: full_body
    terminal_controller: common_bounded_2d_mode_switching
  B1_multimode_kinematic_ramp:
    initial_motion: acceleration_limited_ramp
    planner: multimode_instantaneous_transition
    envelope: full_body
    terminal_controller: common_bounded_2d_mode_switching
  B2_multimode_transition_cost_ramp:
    initial_motion: acceleration_limited_ramp
    planner: multimode_kinematic_with_transition_time_cost
    envelope: full_body
    terminal_controller: common_bounded_2d_mode_switching
    purpose: distinguish_transition_cost_from_state_propagation
  P_dynamics_full_envelope:
    initial_motion: acceleration_limited_ramp
    planner: dynamics_and_full_envelope
    envelope: full_body
    terminal_controller: common_bounded_2d_mode_switching
    implementation_form: hierarchical_spatial_candidates_then_speed_consistent_dynamic_refinement_and_selection
    global_joint_state_search_claimed: false
    mode_and_steering_transition_cost_in_selection: true

comparison_controls:
  initial_motion_controller: identical_acceleration_limited_ramp_for_all_methods
  terminal_controller: identical_bounded_2d_mode_switching_for_all_methods
  speed_and_acceleration_bounds: identical_for_all_methods
  terminal_tolerances_and_safety_abort_rules: identical_for_all_methods
  geometry_start_goal_and_uncertainty_seed: paired_across_methods
  full_envelope_ablation: separately_labelled_safety_diagnostic_not_a_silent_baseline_change

execution_order:
  - common_zero_command_creep_diagnostic_and_cause_check
  - verify_any_common_physics_or_stop_control_change_before_freezing
  - H1_actual_hospital_geometry_path_planning_and_execution_pilot
  - matched_four_method_H1_comparison
  - H2_to_H5_hospital_geometry_and_matched_execution
  - hospital_sensor_closed_loop_validation
  - H6_navigation_mission_and_cross_environment_analysis
  - manuscript_with_separately_labelled_CICS_prior_work

