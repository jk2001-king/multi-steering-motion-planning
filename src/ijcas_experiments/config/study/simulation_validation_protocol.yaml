schema_version: 1
study: patient_transport_steering_mode_aware_path_planning

claim_boundary:
  primary: >-
    A planner that includes the selectable front/rear steering configuration
    and its transition state improves constrained-space task feasibility or
    the clearance-time-terminal-error trade-off relative to fixed steering
    configurations.
  excluded:
    - caster initial-flip control from the completed CICS study
    - exact Livox MID-360 beam-pattern replication
    - physical-platform validity before the real-platform gate

policies:
  - fixed_coordinated_counterphase
  - fixed_front_only
  - fixed_rear_only
  - proposed_state_aware_mode_selective

ablations:
  - proposed_without_measured_initial_steering
  - proposed_without_transition_cost

tasks:
  development:
    - rear_end_constrained
    - front_end_constrained
  professor_gate_held_out:
    - asymmetric_narrow_passage
    - terminal_docking_offset
  paper_held_out:
    - s_bend_narrow_passage
    - obstacle_side_switch

metrics:
  primary:
    - task_success
    - collision_free
    - minimum_clearance_m
    - task_time_s
    - terminal_position_error_m
    - terminal_heading_error_deg
  secondary:
    - path_length_m
    - planning_time_s
    - expanded_nodes
    - mode_switch_count
    - steering_travel_rad
    - peak_steering_rate_rad_s
    - longitudinal_jerk_rms_m_s3

gates:
  professor_simulation_gate:
    sensor_closed_loop_required: true
    matched_policy_comparison_required: true
    ablation_required: true
    randomized_repeat_count: 3
    minimum_task_count: 4
    minimum_robustness_cells: 6
    success_rate_floor: 0.90
    maximum_time_ratio_to_nominal: 1.30
    note: >-
      This gate supports asking for approval to proceed with IJCAS. It is not
      the final paper experiment set.
  final_simulation_gate:
    randomized_repeat_count: 10
    held_out_tasks_required: true
    confidence_interval_required: true
    paired_seed_comparison_required: true
  physical_gate:
    shadow_planning_first: true
    low_speed_execution_second: true
    emergency_stop_required: true
    sim_to_real_paired_scenarios_required: true

robustness_factors:
  # Values are deliberately symbolic until mass and dynamics are measured.
  # The 240/265/290 kg CICS sensitivity cases must not be reported as measured
  # physical masses.
  - total_mass_and_com: nominal_minus / nominal / nominal_plus
  - floor_friction: low / nominal / high
  - initial_active_steering: zero / front_error / rear_error / counterphase_error
  - corridor_margin: tight / nominal / relaxed
  - command_latency: zero / nominal / elevated
  - observation_noise: ideal / nominal

execution_order:
  - G0_existing_feasibility
  - G1_physical_obstacles_and_collision_truth
  - G2_simulated_lidar_closed_loop_map
  - G3_matched_four_policy_comparison
  - G4_state_and_transition_ablation
  - G5_six_cell_robustness_screen
  - G6_professor_review_package
  - G7_final_held_out_simulation
  - G8_physical_shadow_and_low_speed_validation
  - G9_sim_to_real_analysis
