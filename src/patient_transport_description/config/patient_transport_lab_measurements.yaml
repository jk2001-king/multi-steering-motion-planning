    frame_width: 0.760
    maximum_width_including_rotated_casters: 0.965
    frame_only_height: 0.310
    equipment_included_height: 0.426
  longitudinal_frame:
    size: [1.630, 0.160, 0.080]
    center: [0.0, 0.0, 0.270]
  crossbeams:
    center_distance: 1.320
    size: [0.082, 0.760, 0.030]
    front_center: [0.660, 0.0, 0.185]
    rear_center: [-0.660, 0.0, 0.185]
  passive_casters:
    front_left_swivel: [0.462, 0.355, 0.150]
    front_right_swivel: [0.462, -0.355, 0.150]
    rear_left_swivel: [-0.462, 0.355, 0.150]
    rear_right_swivel: [-0.462, -0.355, 0.150]
    wheel_diameter: 0.097
    wheel_width: 0.030
    measured_axle_height: 0.0475
    measured_pivot_to_axle_distance: 0.043
    measured_trail: 0.045
    swivel_continuous: true
    all_four_contact_observed: true
  active_modules:
    front_steering_axis: [0.665, 0.0, 0.174]
    rear_steering_axis: [-0.665, 0.0, 0.174]
    wheel_diameter: 0.145
    wheel_width: 0.050
    measured_axle_height: 0.074
    hardware_steering_continuous: true
    controller_limit_deg: [-45.0, 45.0]
    both_contact_observed: true
  support_contact:
    hard_floor_all_six_wheels_contact_observed: true
    confirmation_date: "2026-10-21"
    confirmation_source: operator_visual_confirmation
    interpretation: >
      All two active wheels and four passive caster wheels contact the hard
      floor. This is not a measurement of equal wheel normal loads.
  equipment_boxes:
    center_battery:
      size: [0.201, 0.319, 0.110]
      center: [0.0, 0.0, 0.365]
    front_electrical:
      size: [0.194, 0.364, 0.108]
      center: [0.6665, 0.0, 0.367]
    rear_electrical:
