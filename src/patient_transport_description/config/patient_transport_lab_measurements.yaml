motor_and_drive_reference:
  module_family: Zhuolan_WDS
  wheel_size_match: WDS150
  wheel_size_m: 0.150
  manual_rated_radial_load_kg: 550
  manual_drive_reduction_options:
    - {ratio: 20, maximum_speed_mps: 1.18}
    - {ratio: 34, maximum_speed_mps: 0.70}
  servo_encoder: 17_bit_absolute
  drive_manual: Leadshine_2ELD2_CAN
  drive_protocol: CANopen
  drive_voltage_vdc: [24, 70]

provisional_not_measured:
  total_mass_kg: 240.0
  total_mass_source: rounded_prior_patient_transport_simulation_mass_not_lab_measurement
  wheel_normal_loads: null
  caster_load_share: null
  center_of_mass: null
  inertias: primitive_geometry_estimate
  friction: null
  contact_compliance: null

resolved_modeling_choices:
  caster_pivot_x_magnitude_m: 0.660
  caster_pivot_x_reason: >
    The recorded x magnitude 0.462 m would leave the caster 0.198 m away
    from its crossbeam. Photos 1, 12 and 13 show the swivel mounted directly
    beneath the crossbeam end. Use the crossbeam center x provisionally and
    remeasure the caster pivot x before treating this as a calibrated model.
  caster_mount_plate:
    size_m: [0.080, 0.080, 0.020]
    modeled_as: visual_only_plate_fixed_to_base_link
    note: approximate geometry inferred from photographs, not separately measured
  active_horizontal_steering_to_axle_offset_m: 0.0
  active_offset_reason: >
    The sheet reports 0.085 m horizontal distance but also reports zero
    longitudinal and lateral offsets. Photographs show an approximately
    coaxial steering axis and wheel center, so the first model uses zero.
  passive_caster_collision_radius_m: 0.0475
  passive_caster_visual_radius_m: 0.0485
  active_wheel_collision_radius_m: 0.074
  active_wheel_visual_radius_m: 0.0725

follow_up_measurement:
  - Remeasure the caster swivel x coordinate from the midpoint between crossbeam centers; the recorded magnitude 0.462 m conflicts with photographs.
  - Resolve whether the reported 0.085 m active-module offset is vertical or horizontal.
  - Read the exact drive and steering motor model numbers from an unobstructed nameplate.
  - Confirm the installed WDS150 drive reduction ratio, 1/20 or 1/34.
